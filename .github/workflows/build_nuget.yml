name: Build and Publish NuGet (OIDC)

on:
  push:
    tags:
      - 'v*.*.*'   # v1.2.0
      - 'ver*.*'   # ver1.2 ( the project's own tag style )
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号（可选，留空则使用 csproj 中的版本）'
        required: false
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production  # 指定为 production 环境，与 NuGet.org 可信发布策略匹配

    permissions:
      id-token: write  # 启用 GitHub OIDC token，用于 Trusted Publishing
      contents: write  # 允许创建 GitHub Release

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: 🔧 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          # 必须是 10.x : Arc.UniInk.Benchmark 目标 net10.0
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 📝 提取版本号
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "使用手动输入的版本号: $VERSION"
          elif [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.ref }}" ]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            VERSION=${VERSION#er}  # ver1.2 -> 1.2
            echo "从 Git 标签提取版本号: $VERSION ( tag: $TAG )"
          else
            VERSION=$(grep -oP '<Version>\K[^<]+' Arc.UniInk/Arc.UniInk.csproj | head -1)
            echo "从 csproj 文件提取版本号: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ 版本号: $VERSION"

      - name: 🔄 更新 csproj 版本号
        if: steps.get_version.outputs.version != ''
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|g" Arc.UniInk/Arc.UniInk.csproj
          bash Tools/sync-unity-package.sh   # 同步 Unity 包的 package.json 与源码副本
          echo "✅ 已更新版本号到 $VERSION"

      - name: 🔍 还原依赖
        run: dotnet restore Arc.UniInk.sln

      - name: 🏗️ 构建项目
        run: dotnet build Arc.UniInk.sln -c Release --no-restore

      - name: 🧪 运行测试 (Release)
        run: dotnet test Arc.UniInk.sln -c Release --no-build --verbosity normal

      - name: 🧪 运行测试 (Debug , 开启池契约断言)
        run: dotnet test Arc.UniInk.Tests/Arc.UniInk.Tests.csproj -c Debug --verbosity normal

      - name: 📦 打包 NuGet
        run: dotnet pack Arc.UniInk/Arc.UniInk.csproj -c Release --no-build -o ./artifacts

      - name: 🧩 打包 Unity 包 ( UPM tarball )
        run: |
          # Unity 的 "Add package from tarball" 需要 npm pack 的 package/ 布局
          cd Unity/Packages/com.arc.uniink
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: 📋 列出生成的包
        run: |
          echo "📦 生成的包:"
          ls -lh ./artifacts/
          unzip -l ./artifacts/*.nupkg
          tar -tzf ./artifacts/*.tgz | head -30

      - name: 🔐 NuGet 登录 (OIDC → 临时 API Key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}  # 您的 nuget.org 用户名（profile name）

      - name: 🚀 发布到 NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.get_version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/*.tgz
          retention-days: 90

      - name: 🎉 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 发布完成
        run: |
          echo "=========================================="
          echo "✅ NuGet 包发布成功！"
          echo "=========================================="
          echo "📦 包名称: Arc.UniInk"
          echo "🏷️  版本号: ${{ steps.get_version.outputs.version }}"
          echo "🔗 NuGet 链接: https://www.nuget.org/packages/Arc.UniInk/"
          echo ""
          echo "⏳ 包通常需要 5-15 分钟才能在 NuGet.org 上可用"
          echo "=========================================="
