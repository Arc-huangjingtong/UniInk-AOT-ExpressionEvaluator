name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          # Arc.UniInk.Benchmark 目标 net10.0 , 需要 10.x SDK
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 🔍 还原依赖
        run: dotnet restore Arc.UniInk.sln

      - name: 🏗️ 构建 (Release)
        run: dotnet build Arc.UniInk.sln -c Release --no-restore

      - name: 🧪 测试 (Release)
        run: dotnet test Arc.UniInk.sln -c Release --no-build --verbosity normal

      - name: 🧪 测试 (Debug , 开启池契约断言)
        run: dotnet test Arc.UniInk.Tests/Arc.UniInk.Tests.csproj -c Debug --verbosity normal

      - name: 🧠 Agent Skill 校验
        run: |
          python3 Tools/check-skills.py
          # the NuGet convention : skills/<name>/SKILL.md inside the package
          dotnet pack Arc.UniInk/Arc.UniInk.csproj -c Release -o ./artifacts-skills
          unzip -l ./artifacts-skills/*.nupkg | grep -q "skills/uniink/SKILL.md"
          echo "skills/uniink/SKILL.md is packed"

      - name: 🧩 Unity 包一致性检查
        run: |
          bash Tools/sync-unity-package.sh --check
          python3 -c "import json; json.load(open('Unity/Packages/com.arc.uniink/package.json')); json.load(open('Unity/Packages/com.arc.uniink/Runtime/Arc.UniInk.asmdef')); print('package.json / asmdef are valid JSON')"
          cd Unity/Packages/com.arc.uniink && npm pack --dry-run
          cd ../../..
          python3 Tools/make-unitypackage.py --out /tmp/unitypackage-check
          tar -tzf /tmp/unitypackage-check/*.unitypackage | head -5

      - name: 📦 打包自检
        run: dotnet pack Arc.UniInk/Arc.UniInk.csproj -c Release --no-build -o ./artifacts

      - name: 📋 包内容
        run: unzip -l ./artifacts/*.nupkg

      - name: 📤 上传包
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          retention-days: 7
